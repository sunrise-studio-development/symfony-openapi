# https://www.php.net/releases/index.php

build:
  image: default-jammy
  nodes:
    analysis:
      environment:
        php: '8.5.6'
      tests:
        override:
          - php-scrutinizer-run
    coverage:
      environment:
        php: '8.4.21'
      dependencies:
        before:
          - pecl install xdebug
      tests:
        override:
          - command: XDEBUG_MODE=coverage php vendor/bin/phpunit --coverage-clover coverage.xml
            coverage:
              file: coverage.xml
              format: clover
    php85:
      environment:
        php: '8.5.6'
      tests:
        override:
          - command: composer test
    php84:
      environment:
        php: '8.4.21'
      tests:
        override:
          - command: composer test
